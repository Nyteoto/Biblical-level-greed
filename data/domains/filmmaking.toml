id       = "filmmaking"
title    = "Filmmaking"
priority = 60
cadence  = { every_n_days = 3 }
color    = "slate"
shape    = "cycles"

# Sequenced on the AFI Conservatory model: first-year "cycle films" (up to
# three narrative shorts, each a complete production), then a second-year
# thesis. Craft courses at AFI and NYU Tisch (Sound Image, Frame and Sequence,
# Fundamentals of Sight and Sound) do not stand alone — they feed the next
# cycle film.
#
# SHAPE: cycles. The board shows the film you are currently making, plus the
# craft that film is waiting on. Not a ladder, because the unit of progress is
# a finished film; not strands, because the craft strands all converge on the
# same project rather than advancing independently.
#
# EVERY EDGE INTO A CYCLE FILM IS SOFT (`prefers`). This is the sharpest
# contrast in the whole system with electrical-engineering.toml, where every
# edge is hard. AFI puts a camera in your hands in the first weeks and has you
# direct three complete films before you are ready for any of them — that is
# the method, not an accident. A locked `cycle-1` would teach the opposite.
#
# The cycle films are `project` nodes and therefore carry NO estimate.
# `estimate = 20` on a film would be a number invented to fill a required
# field: a shoot is four fourteen-hour days after three idle weeks, and you
# cannot do 12% of a shoot day.
#
# THIS IS THE HARDEST DOMAIN HERE TO SELF-TEACH, and not because of the
# material — the books and software are cheap or free, and the post-production
# suite (DaVinci Resolve) is the industry standard at zero cost. It is hard
# because it is the most social: actors, crew, locations, an audience. The
# `entry` lines below say where to find people, not just what to read, because
# finding people is the actual bottleneck.

[season]
state    = "low"

[[node]]
id       = "watch-and-break-down"
title    = "Watching films as a filmmaker"
tier     = 1
estimate = 40
min_each = "60 min"
decay_days = 30
gate     = "Break a scene down shot by shot and say why each cut is where it is"
note     = "The only true drill in this domain — the one thing here that behaves like a daily habit, and it never stops being useful."
entry    = [
    "Free: Every Frame a Painting (YouTube archive) — the standard for scene analysis, and still the best free example of what breaking down means",
    "Free: read the screenplay while you watch. Script Slug and SimplyScripts both host produced screenplays free.",
    "Method: pick one scene, watch it five times, and write down every shot with its size and its cut point. Two hours a scene. This is the drill.",
    "Free: Lessons from the Screenplay and Every Frame a Painting cover different halves — story logic and visual logic. Watch both.",
    "Search: scriptslug, every frame a painting, shot by shot scene analysis",
]

[[node]]
id       = "camera-exposure"
title    = "Camera, lens and exposure"
tier     = 1
estimate = 25
min_each = "45 min"
decay_days = 60
gate     = "Expose correctly by eye and meter, and choose a focal length for a reason you can state"
entry    = [
    "Book: Ascher and Pincus, The Filmmaker's Handbook — the one reference book for this whole domain, and the closest thing to a film school textbook",
    "Free: your camera's own manual, plus the 180-degree shutter rule and the exposure triangle. A phone with a manual-control app is a sufficient camera for this node.",
    "Free: histograms, zebras and false colour on whatever body you have. Exposing by eye means calibrating your eye against a tool first.",
    "Gear reality: none needed beyond a camera you already own. Focal length choice can be practised with a single prime and your feet.",
    "Search: 180 degree shutter rule, false colour exposure video, focal length compression explained",
]

[[node]]
id       = "composition"
title    = "Frame and composition"
tier     = 2
kind     = "study"
requires = ["camera-exposure"]
prefers  = ["watch-and-break-down"]
estimate = 30
min_each = "45 min"
gate     = "Block a two-person scene and cover it in a way that cuts together"
entry    = [
    "Book: Steven Katz, Film Directing Shot by Shot — the standard text on coverage and blocking, and heavily illustrated",
    "Free: StudioBinder's shot list and storyboard templates, free, plus their free video essays on blocking and staging",
    "Free: the Roger Deakins forum (rogerdeakins.com) — free membership, and he answers questions personally. There is no equivalent resource in any other domain here.",
    "The gate is cuts together, which is a continuity problem: eyelines, the 180-degree line, matching sizes. Shoot a two-person scene and try to cut it — you will find the errors immediately.",
    "Search: 180 degree rule filmmaking, shot reverse shot coverage, blocking a two person scene",
]

[[node]]
id       = "production-sound"
title    = "Recording clean production sound"
tier     = 2
requires = ["camera-exposure"]
estimate = 25
min_each = "45 min"
decay_days = 60
gate     = "Bring back dialogue from a real location that needs no ADR"
note     = "The most common failure in first films, and the least glamorous fix."
entry    = [
    "Free: Curtis Judd (YouTube) — the most thorough free location-sound education available, and unusually rigorous about levels and noise floor",
    "Gear: a shotgun or lav mic and a recorder, roughly $150-300 used. This is the highest-return money in the entire domain, and cheaper than any lens.",
    "Rule: get the mic close. Every other sound problem is downstream of mic distance, and no plugin fixes it.",
    "Record room tone for 30 seconds on every location, every time. The editor — you — will need it.",
    "Search: curtis judd location sound, boom mic technique dialogue, room tone why record",
]

[[node]]
id       = "story-structure"
title    = "Story structure and screenwriting"
tier     = 2
kind     = "study"
prefers  = ["watch-and-break-down"]
estimate = 45
min_each = "60 min"
gate     = "Say what your story is about in one sentence and have someone else recognise it in the script"
entry    = [
    "Book: David Mamet, On Directing Film — short, severe, and the fastest correction to writing scenes that do not dramatise anything",
    "Book: Robert McKee, Story, for the long version; Blake Snyder, Save the Cat, for the commercial-structure version",
    "Free: Script Slug and SimplyScripts — read produced screenplays, especially shorts. Reading twenty shorts teaches format faster than any guide.",
    "Free software: Trelby (open source), or WriterDuet's free tier. Do not pay for Final Draft to write five pages.",
    "The gate needs another person. Give someone the script cold and ask what it was about — if the answer is not your sentence, the script is not there yet.",
    "Search: trelby screenwriting, short film screenplay examples, mamet on directing film summary",
]

[[node]]
id       = "editing-grammar"
title    = "Editing — continuity, coverage, rhythm"
tier     = 3
requires = ["composition"]
estimate = 40
min_each = "60 min"
decay_days = 60
gate     = "Cut footage you did not shoot into a scene that plays"
entry    = [
    "Free: DaVinci Resolve — the full professional application, free, with no watermark or time limit",
    "Free: Blackmagic's own official training books (blackmagicdesign.com/products/davinciresolve/training) — six PDF volumes with lesson footage included, free. The footage solves this node's gate directly.",
    "Book: Walter Murch, In the Blink of an Eye — the theory of the cut, and short enough to read in an evening",
    "The gate says footage you did not shoot on purpose: cutting your own material lets you cut around your mistakes. Use the Blackmagic lesson footage, or any free stock scene.",
    "Search: davinci resolve training books free, in the blink of an eye murch, editing continuity rules",
]

[[node]]
id       = "short-script"
title    = "A producible five-page script"
tier     = 3
kind     = "project"
requires = ["story-structure"]
phases   = ["outline", "first draft", "table read", "shooting draft"]
min_each = "one working session"
gate     = "Five pages you can actually shoot with the people and locations you have"
entry    = [
    "Write to your constraints, not around them. List your locations and your available actors FIRST, then write to that list.",
    "The table read phase needs bodies in a room, or a video call. Hearing it aloud is the only way to find the unsayable lines.",
    "Free: Trelby or WriterDuet free tier, as above. Five pages is roughly five minutes of screen time.",
    "Search: short film script format, producible short film ideas one location, table read how to run",
]

[[node]]
id       = "cycle-1"
title    = "Cycle 1 — a silent three-minute film"
tier     = 4
kind     = "project"
prefers  = ["editing-grammar", "production-sound", "short-script"]
phases   = ["prep", "shoot", "post", "show it"]
min_each = "one working day"
gate     = "Finished. Shown to people. No dialogue, and the story still landed."
note     = "AFI's first cycle film is deliberately dialogue-free, to force visual storytelling. Every edge into it is soft: start it before you are ready, because that is the only way the craft nodes above ever mean anything."
entry    = [
    "There is no resource for this node. It is the doing. The craft nodes above are soft-linked precisely so you can start now.",
    "Silent means no dialogue, not no sound. Music and effects are allowed and this is where you learn what they carry.",
    "Crew of one is fine for cycle 1. A phone, available light, and one actor is a legitimate first film.",
    "Show it phase is not optional and not a formality — it is where the film stops being yours and starts being information.",
    "Search: silent short film examples, visual storytelling without dialogue",
]

[[node]]
id       = "directing-actors"
title    = "Directing actors"
tier     = 5
kind     = "social"
prefers  = ["cycle-1"]
estimate = 35
min_each = "90 min"
gate     = "Gave a note that changed a performance for the better, and knew why it worked"
entry    = [
    "Book: Judith Weston, Directing Actors — the industry standard for 25 years, and there is no real second place",
    "Find actors: Backstage, Mandy, StarNow, local drama schools, community theatre. Student and early-career actors want reel footage and will work on shorts for it.",
    "Free and transformative: take an acting class yourself. Understanding the job from inside changes what your notes sound like more than any book.",
    "Weston's core distinction is result-direction versus playable-direction. Learn it before your first rehearsal, not after.",
    "Search: judith weston directing actors, playable direction vs result direction, find actors for short film",
]

[[node]]
id       = "producing-logistics"
title    = "Producing — schedule, budget, call sheets"
tier     = 5
kind     = "study"
prefers  = ["cycle-1"]
estimate = 30
min_each = "90 min"
gate     = "Ran a shoot day that finished on schedule and fed everyone"
entry    = [
    "Free: StudioBinder's production document library (studiobinder.com/film-production-documents) — call sheets, shot lists, schedules, budgets, release forms. All free templates, and the industry formats.",
    "Free: location and talent release forms, from the same place. Get these signed. A film with no releases cannot be shown at festivals.",
    "Feed everyone is in the gate literally. Catering is the single largest determinant of whether an unpaid crew comes back.",
    "Learn the 1st AD's job even if you never hold it: the schedule is what makes a day finish on time.",
    "Search: studiobinder call sheet template, film release form template, shooting schedule breakdown",
]

[[node]]
id       = "cycle-2"
title    = "Cycle 2 — a dialogue scene with a crew"
tier     = 6
kind     = "project"
prefers  = ["cycle-1", "directing-actors", "producing-logistics"]
phases   = ["cast", "prep", "shoot", "post", "show it"]
min_each = "one working day"
gate     = "Finished. Actors and crew you did not know beforehand would work with you again."
entry    = [
    "Find crew: local film groups, film-school noticeboards, Facebook and Discord filmmaking communities in your city, Mandy crew listings.",
    "The gate is would work with you again, which is a producing and communication result, not a craft one. It is measured after wrap, by whether they answer.",
    "Pay something if you possibly can, feed everyone always, and send everyone the finished film.",
    "Search: find film crew locally, no budget short film crew, first AD checklist shoot day",
]

[[node]]
id       = "cinematography"
title    = "Lighting and cinematography"
tier     = 7
prefers  = ["cycle-2"]
estimate = 45
min_each = "90 min"
decay_days = 90
gate     = "Light an interior at night so it reads as a place, not as a lit set"
entry    = [
    "Book: Blain Brown, Cinematography: Theory and Practice — the standard text; John Alton, Painting With Light, for the older and more opinionated one",
    "Free: the ARRI lighting handbook and ARRI's online lighting resources, free and authoritative",
    "Free: the Roger Deakins forum again — the lighting threads are a working masterclass and cost nothing",
    "Gear: two lights and a bounce board is enough for this gate. Practise motivating each source from something visible in frame.",
    "Search: motivated lighting interior night, arri lighting handbook, practicals in frame cinematography",
]

[[node]]
id       = "post-sound-color"
title    = "Post — sound design, mix, colour"
tier     = 7
prefers  = ["cycle-2"]
estimate = 40
min_each = "90 min"
decay_days = 90
gate     = "Delivered a mix that holds up on laptop speakers and in a room, and a grade that is invisible"
entry    = [
    "Free: DaVinci Resolve does all three — Fairlight for the mix, the Color page for the grade. Free version covers everything this node needs.",
    "Free: Blackmagic's official training books cover Fairlight and colour specifically, with lesson projects, as PDFs",
    "Free: freesound.org for effects, under Creative Commons. Check the licence on each file.",
    "Check the mix on laptop speakers, phone speakers, and headphones. The gate names laptop speakers because that is where most people will actually watch it.",
    "Search: fairlight dialogue mix tutorial, davinci resolve color grading basics, loudness standards -14 LUFS youtube",
]

[[node]]
id       = "cycle-3"
title    = "Cycle 3 — a fifteen-minute short, festival intent"
tier     = 8
kind     = "project"
prefers  = ["cycle-2", "cinematography", "post-sound-color"]
phases   = ["develop", "prep", "shoot", "post", "deliver to spec"]
min_each = "one working day"
gate     = "Finished, delivered to festival spec, and you are not embarrassed by it"
entry    = [
    "Free: FilmFreeway — browse festivals and read their technical specs before you finish post, not after. Deliver to spec is a phase for a reason.",
    "Fifteen minutes is long for a short and hard to programme. Under twelve is materially easier to get selected.",
    "Budget for entry fees: they are $20-70 each and are the real cost of this node. Pick ten festivals, not fifty.",
    "Deliverables usually mean a DCP or ProRes master, plus stills, a poster, and a dialogue list. Find out which before picture lock.",
    "Search: filmfreeway festival strategy short film, festival deliverables checklist, DCP for short film",
]

[[node]]
id       = "audience"
title    = "Sitting in the room with an audience"
tier     = 9
kind     = "social"
prefers  = ["cycle-3"]
estimate = 15
min_each = "one screening"
gate     = "Watched strangers watch it, and learned something you could not have learned any other way"
note     = "Cannot be practised, only undergone. The feedback is unbuyable and arrives all at once."
entry    = [
    "No resource. Sit in the room, at the back, and watch the audience rather than the screen.",
    "If no festival takes it: local screening nights, film clubs, a hired room, a pub back room. The audience matters, the venue does not.",
    "Note exactly where they shift, cough, or check phones. That is the edit note nobody will ever give you politely.",
    "Search: local short film screening night, host a film screening",
]

[[node]]
id       = "develop-longform"
title    = "Developing a feature or series"
tier     = 9
kind     = "project"
prefers  = ["cycle-3"]
phases   = ["treatment", "first draft", "notes pass", "get it read"]
min_each = "one working session"
gate     = "A treatment and a draft that a producer read to the end"
entry    = [
    "Free: read produced feature screenplays in your genre from Script Slug. Twenty of them, before drafting.",
    "The Black List (blcklst.com) hosts paid script evaluations and is the standard route to being read cold. Budget for it or find a producer directly.",
    "Free: many production companies list submission policies publicly. Most require an agent; some do not, and the ones that do not are the list you want.",
    "The notes pass phase means acting on notes you disagree with, at least once, to see what happens.",
    "Search: the black list script hosting, feature treatment format, how to get a script read by producers",
]

[[node]]
id       = "thesis-film"
title    = "Thesis — the film that represents you"
tier     = 10
kind     = "project"
prefers  = ["audience", "develop-longform"]
phases   = ["develop", "finance", "prep", "shoot", "post", "release"]
min_each = "one working day"
gate     = "The film you point at when someone asks what you do"
entry    = [
    "The finance phase is the one with no free resource and no substitute. Grants, film funds, crowdfunding, private investment — research the ones in your country specifically, since almost all funding is national.",
    "Free: your national film body's funding pages. Most countries have one, most have short and emerging-filmmaker schemes, and most are undersubscribed.",
    "Everything else in this node you have already done at smaller scale. This is the same six phases with more money and more people.",
    "Search: film funding schemes [your country], crowdfunding a short film, emerging filmmaker grants",
]
