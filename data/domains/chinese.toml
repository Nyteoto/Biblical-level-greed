id       = "chinese"
title    = "Chinese (HSK)"
priority = 10
cadence  = "daily"
color    = "rose"
shape    = "ladder"

# Sequenced against HSK 3.0. Full sourcing in docs/sources.md.
#
# NO NODE HERE REQUIRES SITTING AN EXAM. Every level is a `study` node gated on
# unseen mock papers you mark yourself. The HSK levels are syllabi — the word
# lists, grammar points and past papers are all published free — and the
# syllabus is separable from the test centre. Only `certificate` is an `exam`,
# it is the last node, and nothing depends on it. If you never sit one, this
# domain still completes.
#
# Vocabulary counts are the CURRENT (Nov 2025 CTI syllabus, in force July 2026)
# figures, which are much lower than the 2021 proposal that most sites still
# quote. Character counts are omitted because the per-level recognition vs
# handwriting split is not something I could verify.

[season]
state    = "low"

[[node]]
id       = "pinyin-tones"
title    = "Pinyin and the four tones"
tier     = 1
sessions = 1
min_each = "20 min"
decay_days = 120
gate     = "Hear a tone in isolation and name it, 9 times in 10"
note     = "Tone errors set here are the expensive ones — they ossify and cost years to undo."
entry    = [
    "Free: AllSet Learning Chinese Pronunciation Wiki — every sound and tone, with audio, at resources.allsetlearning.com/chinese/pronunciation",
    "Free: Sinosplice Tone Pair Drills — the standard fix for tones in combination, which is where they actually break",
    "Free: Pleco (iOS/Android) — dictionary with native audio on every entry; the one app to install first",
    "Search: tone pair drills mandarin, third tone sandhi",
]

[[node]]
id       = "hanzi-foundations"
title    = "Radicals and stroke order"
tier     = 2
requires = ["pinyin-tones"]
sessions = 1
min_each = "25 min"
decay_days = 180
gate     = "Write any of the 100 commonest radicals from memory, correct stroke order"
entry    = [
    "Free: the 214 Kangxi radicals — any published list; learn the ~100 that actually recur",
    "Free: Pleco stroke-order diagrams, or hanzistroke.com, for animated stroke order",
    "Free: Anki (desktop/Android free, iOS paid) with FSRS enabled — the spaced-repetition engine everything below assumes",
    "Book: Heisig, Remembering the Simplified Hanzi 1 — mnemonic system, divisive but effective if you finish it",
    "Search: kangxi radicals list, chinese stroke order rules",
]

[[node]]
id       = "hsk1"
title    = "HSK 1 — 300 words"
tier     = 3
kind     = "study"
requires = ["hanzi-foundations"]
sessions = 1
min_each = "30 min"
gate     = "Scored 85%+ on two unseen HSK 1 mock papers, timed, in one sitting"
entry    = [
    "Free: HSK 3.0 word lists — github.com/krmanik/HSK-3.0 ships all nine levels as Anki decks with pinyin and audio",
    "Free: HSK Mock (hskmock.com) — the official practice platform, real retired questions and scoring",
    "Free: Chinese Grammar Wiki (resources.allsetlearning.com/chinese/grammar) — every grammar point, graded A1-C2, CC-licensed",
    "Free: Fluentide — 340 comprehensible-input episodes graded to HSK level, with transcripts",
    "Search: HSK 1 vocabulary list 3.0 pdf, HSK 1 mock test free",
]

[[node]]
id       = "hsk2"
title    = "HSK 2 — 500 words"
tier     = 4
kind     = "study"
requires = ["hsk1"]
sessions = 1
min_each = "30 min"
gate     = "Scored 85%+ on two unseen HSK 2 mock papers, timed, in one sitting"
entry    = [
    "Free: same stack as HSK 1 — Anki deck for the level, HSK Mock for papers, Grammar Wiki for the new patterns",
    "Free: DuChinese and The Chairman's Bao both give a few graded texts per day at no cost",
    "Search: HSK 2 vocabulary list 3.0, HSK 2 grammar points",
]

[[node]]
id       = "hsk3"
title    = "HSK 3 — 1,000 words"
tier     = 5
kind     = "study"
requires = ["hsk2"]
sessions = 1
min_each = "35 min"
gate     = "Scored 80%+ on two unseen HSK 3 mock papers, timed, including the writing section"
note     = "Writing joins listening and reading at this level, and the HSKK oral exam becomes mandatory alongside the written paper — which is why speaking starts at the next tier and not at HSK 7."
entry    = [
    "Free: HSK 3 word list and mock papers as above — mandarinbean.com and hsklord.com both host free level-3 PDFs",
    "Free: Chinese Grammar Wiki B1 section covers essentially the whole HSK 3 grammar syllabus",
    "Practice: handwrite, on paper. The writing section is the one part mock-testing on a screen will not prepare you for.",
    "Search: HSK 3 writing section format, HSKK beginner sample",
]

[[node]]
id       = "speaking-practice"
title    = "Speaking with people, weekly"
tier     = 6
kind     = "social"
requires = ["hsk2"]
sessions = 1
min_each = "30 min"
gate     = "Hold a 10-minute unscripted conversation on a familiar topic without dropping to English"
note     = "Social: you cannot do this alone, and it is now examined from HSK 3 up rather than HSK 7. Start it under-prepared — this is the strand that atrophies if you wait until you feel ready."
entry    = [
    "Free: HelloTalk or Tandem — language exchange, you correct their English and they correct your Chinese",
    "Paid but cheap: italki community tutors, often under $10/hour, and the closest thing to a real HSKK rehearsal",
    "Free: record yourself answering HSKK prompts and listen back — brutal, and the fastest correction loop available alone",
    "Search: HSKK sample questions, chinese language exchange partner",
]

[[node]]
id       = "hsk4"
title    = "HSK 4 — 2,000 words"
tier     = 7
kind     = "study"
requires = ["hsk3"]
prefers  = ["speaking-practice"]
sessions = 1
min_each = "40 min"
gate     = "Scored 80%+ on two unseen HSK 4 mock papers, timed, all sections"
entry    = [
    "Free: HSK 4 Anki deck plus HSK Mock papers, as above",
    "Free: Chinese Grammar Wiki B2 — this is where the grammar stops being pattern-drills and starts being register",
    "Watch: Chinese-subtitled native TV with the Language Reactor browser extension (free tier) — dual subtitles and pop-up dictionary",
    "Search: HSK 4 vocabulary list 3.0, language reactor chinese",
]

[[node]]
id       = "native-reading"
title    = "Unassisted native-text reading"
tier     = 8
requires = ["hsk4"]
sessions = 1
min_each = "30 min"
decay_days = 60
gate     = "Finish a full-length novel without looking up more than 5 words a page"
note     = "Exam vocabulary alone will not carry you into HSK 6, which is why this sits between HSK 4 and HSK 5 rather than after everything. Decays fastest of anything here — 60 idle days and it needs restarting."
entry    = [
    "Free: Hacking Chinese, The 10 best free Chinese reading resources — the honest survey, sorted by level",
    "Free: the One 一个 app (韩寒) — short stories by real authors, the standard step up to native text",
    "Paid, worth it: Mandarin Companion graded readers — genuinely readable novellas at 300-450 unique characters",
    "Free: Pleco screen-reader / clipboard reader turns any text into a tappable-dictionary text",
    "Search: chinese graded readers by level, hacking chinese reading challenge",
]

[[node]]
id       = "hsk5"
title    = "HSK 5 — 3,600 words"
tier     = 9
kind     = "study"
requires = ["native-reading"]
sessions = 1
min_each = "40 min"
gate     = "Scored 75%+ on two unseen HSK 5 mock papers, timed, all sections"
entry    = [
    "Free: HSK 5 Anki deck and HSK Mock papers",
    "Free: Chinese newspapers directly — 人民日报, 新华网. At HSK 5 the news is the level-appropriate material.",
    "Search: HSK 5 vocabulary list 3.0, chinese news for learners",
]

[[node]]
id       = "hsk6"
title    = "HSK 6 — 5,400 words"
tier     = 10
kind     = "study"
requires = ["hsk5"]
sessions = 1
min_each = "45 min"
gate     = "Scored 75%+ on two unseen HSK 6 mock papers, timed, all sections"
entry    = [
    "Free: HSK 6 Anki deck and HSK Mock papers",
    "Free: 得到 and 看理想 podcasts, or any Chinese-language nonfiction — HSK 6 vocabulary is essayistic, not conversational",
    "Search: HSK 6 vocabulary list 3.0, chinese podcasts for advanced learners",
]

[[node]]
id       = "hsk7-9"
title    = "HSK 7-9 — 11,000 words, one banded exam"
tier     = 11
kind     = "study"
requires = ["hsk6"]
prefers  = ["speaking-practice"]
sessions = 1
min_each = "60 min"
gate     = "Scored at band 7 or above on two unseen HSK 7-9 mock papers, all five sections"
note     = "ONE node, not three. HSK 7-9 is a single 98-question exam and your score decides which of the three certificates you get — so modelling 7, 8 and 9 as sequential nodes would mean sitting the same paper three times. Five sections: listening, reading, writing, translation, speaking."
entry    = [
    "Free: chinesetest.cn publishes the HSK 7-9 format and sample paper",
    "Free: HSK Mock has 7-9 material; there is much less of it than at lower levels, so ration it",
    "Reality: translation and speaking are separately trainable skills that no amount of reading will cover. Budget for both.",
    "Search: HSK 7-9 sample paper, HSK 7-9 translation section",
]

[[node]]
id       = "certificate"
title    = "Sit a real HSK, for the certificate"
tier     = 12
kind     = "exam"
prefers  = ["hsk4"]
sessions = 1
min_each = "60 min"
gate     = "Sat an official HSK at the level you had reached, and passed"
note     = "The only node in this domain that needs a test centre, a date and a fee — and nothing depends on it. It sits last because a ladder has to order everything, not because it is a final step: sit it at whatever level you have reached, whenever a visa, a university or an employer actually asks for the paper. Most people need exactly one certificate, once. Check chinesetest.cn for internet-based and home-based options before assuming you need to travel."
entry    = [
    "Register: chinesetest.cn — pick test centre and date, pay the fee. Check whether IBT (internet-based) or home-based testing covers your region.",
    "Note: the written HSK and the spoken HSKK are registered separately at most centres.",
    "Search: HSK test centre near me, HSK internet based test, HSK exam dates 2026",
]
