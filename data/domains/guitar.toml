id       = "guitar"
title    = "Electric Guitar"
priority = 20
cadence  = "daily"
color    = "amber"
shape    = "strands"
strands  = ["technique", "theory", "ear", "repertoire"]

# Sequenced against the Berklee guitar major (BPS/OGUIT sample curriculum).
# Full sourcing in docs/sources.md.
#
# SHAPE: strands. The domain that forced the shape to exist. Berklee runs
# Private Lessons (technique), Harmony (theory) and Ear Training (ear)
# concurrently every semester, and its published prerequisite chain proves the
# dependency runs sideways: Scales 101 and Chords 101 both require Harmony 1
# first. Theory gates the instrument.
#
# TITLES ARE CONCEPTS, NOT COURSE CODES. Earlier versions of this file used
# Berklee's internal names — Guitar Chords 101, Getting Your Guitar Sound —
# which are unsearchable at best and actively misleading at worst: searching
# `Guitar Chords 101` returns beginner open-chord blogs, when the node is
# about drop 2 voicings. Node ids are unchanged, so no history is orphaned.
#
# The default free spine for this whole domain is justinguitar.com, and the
# default paid spine is Leavitt's A Modern Method for Guitar — the actual
# Berklee textbook. Where a node says neither, it means neither covers it.

[season]
state    = "low"

[[node]]
id       = "hands-and-tone"
title    = "Posture, picking hand, fretting hand"
tier     = 1
strand   = "technique"
estimate = 25
min_each = "20 min"
metric   = "bpm"
metric_target = 120
decay_days = 21
gate     = "Chromatic exercise at 120bpm, alternate picked, clean, no left-hand tension"
note     = "Berklee assesses this in week one and places you accordingly. It is the placement test."
entry    = [
    "Free: JustinGuitar Beginner Grade 1 — the best free structured guitar course that exists, and it starts exactly here",
    "Free: any metronome app, or a browser metronome. Every bpm gate in this file assumes one.",
    "Watch: Troy Grady, Cracking the Code (free YouTube material) on picking mechanics — start here rather than fixing a broken picking hand in year three",
    "Search: alternate picking technique, guitar left hand tension, 1234 chromatic exercise",
]

[[node]]
id       = "music-foundations"
title    = "Music foundations — notes, intervals, key signatures"
tier     = 1
kind     = "study"
strand   = "theory"
estimate = 20
min_each = "25 min"
gate     = "Name any interval and spell any major key without counting"
entry    = [
    "Free: musictheory.net — lessons plus drill exercises; the exercises are the point, not the lessons",
    "Free: Open Music Theory v2 (viva.pressbooks.pub/openmusictheory) — a full undergraduate theory textbook, open-licensed, with workbooks",
    "Drill: musictheory.net note and interval trainers, 10 minutes daily. This is rote and there is no shortcut.",
    "Search: circle of fifths explained, interval quality major minor perfect",
]

[[node]]
id       = "ear-training-1"
title    = "Ear Training 1 — intervals and solfege"
tier     = 1
strand   = "ear"
estimate = 40
min_each = "20 min"
decay_days = 30
gate     = "Sing a written line at sight; identify any interval played cold"
entry    = [
    "Free: Functional Ear Trainer (iOS/Android/desktop) — teaches scale degrees against a tonal centre, which is what actually transfers to playing",
    "Free: Earpeggio (Android) — intervals, chords, scales, melodic and rhythmic dictation, genuinely free with no upsell",
    "Free: musictheory.net ear trainers in the browser",
    "Note: sing everything you identify. Ear training that never leaves the ears does not connect to the instrument.",
    "Search: functional ear training scale degrees, solfege sight singing beginner",
]

