    "Free: Open Music Theory, Diatonic Harmony unit — worksheets included",
    "Free: musictheory.net chord and scale lessons for the mechanics",
    "Do it on paper, away from the guitar. The gate says on paper because shape-recognition on the fretboard will let you fake this indefinitely.",
