id       = "drumming"
title    = "Drumming"
priority = 30
cadence  = "daily"
color    = "violet"
shape    = "strands"
strands  = ["hands", "reading", "coordination", "styles"]

# Sequenced against the Berklee drum set core: grip and stroke, the 40 PAS
# rudiments, snare reading, then two-, three- and four-way coordination, then
# the style vocabulary (R&B, pop-rock, funk, jazz, Brazilian, Afro-Cuban) and
# the odd meters. Standard texts: Stone's "Stick Control", Reed's
# "Progressive Steps to Syncopation".
#
# SHAPE: strands. The hands and the reading develop independently for a long
# time and only merge at chart reading — a drummer with fast hands who cannot
# read is a common and specific failure, and so is the reverse.
#
# This is the domain with the most `metric` fields, and the reason the feature
# exists: every gate here is a tempo-and-cleanliness reading. Logging the bpm
# you actually hit turns a check-off into a measurement. The app stores the
# number you type and does nothing clever with it.
#
# This domain is the cheapest here to self-teach and always was: the canon is
# two books that cost about $20 together, the rudiment reference is free and
# official, and a practice pad substitutes for a kit through most of the hands
# strand. The other five files were rewritten to match what this one already
# did — name the book and the page, not just the skill.

[season]
state    = "low"

[[node]]
id       = "grip-and-stroke"
title    = "Grip and the four strokes"
tier     = 1
strand   = "hands"
estimate = 25
min_each = "20 min"
metric   = "bpm"
metric_target = 100
decay_days = 14
gate     = "Full, down, tap and up strokes, both hands, even and relaxed at 100bpm"
note     = "Tension set here becomes injury later. This is the one node worth over-investing in."
entry    = [
    "Buy first: a practice pad and a pair of 5A sticks. Roughly $40 total, and it covers the entire hands strand without a kit.",
    "Free: Drumeo free lessons (drumeo.com/free-drum-lessons) — the Moeller and stroke-type material specifically",
    "Free: Stephen Taylor (stephensdrumshed.com and YouTube) — clearest free breakdown of the four stroke types",
    "Watch for: any tension in the grip at all. Film your hands; you cannot feel this but you can see it.",
    "Search: four stroke types drumming, matched grip fulcrum, moeller technique beginner",
]

[[node]]
id       = "snare-reading"
title    = "Snare reading — quarters through sixteenths"
tier     = 1
strand   = "reading"
estimate = 35
min_each = "20 min"
decay_days = 30
gate     = "Sight-read a page of snare étude in 4/4 without stopping"
entry    = [
    "Book: Podemski, Standard Snare Drum Method, or Mitchell Peters, Elementary Snare Drum Studies — either is the standard first reading text",
    "Free: musictheory.net rhythm section for note values and time signatures, if notation itself is new",
    "Free: sheetmusicgenerator.com generates unlimited rhythm exercises so you never re-read the same line",
    "Rule: count out loud. Reading rhythm silently lets you fake subdivision indefinitely.",
    "Search: snare drum reading exercises pdf, sixteenth note counting drums",
]

