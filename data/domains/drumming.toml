    "Book: George Lawrence Stone, Stick Control for the Snare Drummer. About $10. Pages 5-7 alone are years of work.",
    "Free: Percussive Arts Society, New Approaches to Reed's Syncopation and Stone's Stick Control (pas.org) — how to actually use the book rather than just play down it",
    "Method: each line 20 times, metronome, one page per session. Stone gives no instructions on purpose; the article above supplies them.",
    "Search: stick control stone how to practice, hand balance weak hand drums",
]

