entry    = [
    "Book: Ted Reed, Progressive Steps to Syncopation for the Modern Drummer. About $10, and the single most-used book in the instrument.",
    "Free: PAS, New Approaches to Reed's Syncopation — the interpretation systems that make pp.29-44 into a decade of material",
    "Book: John Riley, The Art of Bop Drumming, if you want the jazz interpretations laid out explicitly",
    "Search: reed syncopation interpretations, syncopation pages 29-44 jazz, ted reed exercises how to use",
]

