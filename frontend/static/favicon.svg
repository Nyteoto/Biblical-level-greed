<!-- The capture bar's indicator notch, condensed until it survives a tab strip.
     Same proportions as the PNGs: a straight top edge with a tab dropping from
     the middle, narrower at the bottom than the top. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0a1116"/>
  <g filter="url(#glow)">
    <path fill="#4fff9f"
          d="M8.3,25.6 H55.7 V30.4 H39.4 L36.8,41.3 H27.2 L24.6,30.4 H8.3 Z"/>
  </g>
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
