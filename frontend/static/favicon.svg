<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Personal Growth System</title>
  <!-- A tech tree read left to right: three tiers, a solid edge (hard
       prerequisite), a dashed edge (soft), and one node lit as active. -->
  <rect width="512" height="512" rx="112" fill="#14100c"/>

  <g stroke="#57534e" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M150 256 H210"/>
    <path d="M302 190 H362"/>
  </g>
  <g stroke="#57534e" stroke-width="14" stroke-linecap="round" fill="none" stroke-dasharray="6 26">
    <path d="M302 322 H362"/>
  </g>

  <!-- tier I: done -->
  <circle cx="112" cy="256" r="38" fill="none" stroke="#57534e" stroke-width="16"/>
  <path d="M96 256 l12 13 l21 -26" stroke="#a8a29e" stroke-width="14" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tier II: active -->
  <circle cx="256" cy="256" r="46" fill="#fbbf24"/>

  <!-- tier III: one available, one still open -->
  <circle cx="400" cy="190" r="34" fill="none" stroke="#78716c" stroke-width="16"/>
  <circle cx="400" cy="322" r="34" fill="none" stroke="#57534e" stroke-width="14"
          stroke-dasharray="18 16"/>
</svg>
