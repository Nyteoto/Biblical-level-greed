<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover lets the page paint under the notch and home
		     indicator; app.css pads content back out with safe-area insets. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />
		<title>Tech Tree</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#14100c" />
		<!-- iOS ignores the manifest for the home-screen icon and for standalone
		     mode; these three are what "Add to Home Screen" actually reads. -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Growth" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background: #14100c">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
